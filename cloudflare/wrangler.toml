# Deploys cloudflare/worker.js as the "shambconkins" Worker: .github/workflows/deploy-worker.yml runs `wrangler deploy`
# from this folder whenever cloudflare/ changes on main (secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID, see README).
# The custom domain (shambconkins.loki-mylo.work) was attached in the dashboard and stays attached; it isn't listed here
# so a deploy never needs DNS permissions. keep_vars keeps any variables set in the dashboard.
name = "shambconkins"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
keep_vars = true

# The app's pictures and sounds (/a/<hash>.<ext>, docs/PWA_SPLIT_DELIVERY.md): static assets from public/, which
# tools/worker-assets.sh fills from the newest releases' _pwa.zip right before each deploy (public/a/ isn't in git).
# Cloudflare serves a request that matches a file there without running worker.js; everything else goes to worker.js.
# Free plan: 20,000 files per deploy, 25 MiB per file; only files Cloudflare doesn't have yet are uploaded.
[assets]
directory = "public"

# Online rooms: one Durable Object per room name (class Room in worker.js). SQLite-backed classes run on the free plan.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "rooms-v1"
new_sqlite_classes = ["Room"]

# High-score tables (ROADMAP I13): one Durable Object (class Scores in worker.js, SQLite) holds every game's top scores.
[[durable_objects.bindings]]
name = "SCORES"
class_name = "Scores"

[[migrations]]
tag = "scores-v1"
new_sqlite_classes = ["Scores"]
