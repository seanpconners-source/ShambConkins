<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12130f"><meta name="application-name" content="ShambConkins"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ShambConkins"><meta name="description" content="ShambConkins: a party board game for two, with minigames, unlockable characters and online play."><title>ShambConkins</title><!--@@STYLE@@--></head>
<body><div id="boot" role="status" aria-live="polite"><style>#boot{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:#000;color:#e8dcc0;font:700 15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.05em;text-align:center;transition:opacity .35s}#boot img{width:min(38vw,190px);height:auto}#boot .bt-bar{width:min(66vw,340px);height:8px;border-radius:4px;background:#2a2233;overflow:hidden;box-shadow:0 0 0 1px #c99a3d55}#boot .bt-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#b8862f,#ffe2a6);transform-origin:0 50%;transform:scaleX(.03);animation:bt-fill var(--bt-ms,15s) cubic-bezier(.25,.7,.35,1) forwards}#boot p{margin:0;color:#e8dcc0;font:inherit}#boot small{display:block;margin-top:6px;font-weight:500;font-size:12px;letter-spacing:.03em;color:#a99fb8}@keyframes bt-fill{to{transform:scaleX(.94)}}#boot.bt-done{opacity:0;pointer-events:none}#boot.bt-done .bt-bar i{animation:none;transform:scaleX(1)}</style><img src="@@asset:assets/pwa/icon-192.png@@" alt=""><div class="bt-bar"><i></i></div><p id="boot-text">Starting ShambConkins…</p><script>(function(){try{var b=document.getElementById('boot'),v='@@VERSION@@',last=localStorage.getItem('sc-boot-version'),ms=+localStorage.getItem('sc-boot-ms')||0,t=document.getElementById('boot-text');
b.style.setProperty('--bt-ms',Math.round(Math.max(2500,Math.min(90000,ms?ms*1.15:20000)))+'ms');
t.innerHTML=!last?'Setting up ShambConkins…<small>The first start takes the longest.</small>':last!==v?'Updating to v'+v+'…<small>Unpacking the new version.</small>':'Starting ShambConkins…';
// real progress from the installed app's offline copy (sw.js 'sc-load'): the page and the built-in art script as they download
var bar=b.querySelector('.bt-bar i'),mb=function(n){return (n/1048576).toFixed(1)+' MB';};
if(navigator.serviceWorker){navigator.serviceWorker.addEventListener('message',function(e){var d=e.data||{};if(d.type!=='sc-load'||!document.getElementById('boot'))return;
 var f=d.total?Math.min(1,d.got/d.total):0,what=d.kind==='art'?'Downloading pictures':!last?'Downloading the game':last!==v?'Downloading v'+v:'Loading';
 bar.style.animation='none';bar.style.transition='transform .25s';bar.style.transform='scaleX('+(d.done?.94:Math.max(.03,d.total?f*.9:.45))+')';
 t.innerHTML=d.done?(last&&last!==v?'Updating to v'+v+'…':'Starting ShambConkins…')+'<small>Almost there.</small>':what+' · '+(d.total?Math.round(f*100)+'%':mb(d.got))+'<small>'+(d.total?mb(d.got)+' of '+mb(d.total)+'. Keep the app open.':'Keep the app open.')+'</small>';});
 try{navigator.serviceWorker.startMessages();}catch(e){}}
window.addEventListener('error',function(){var e=document.getElementById('boot');if(e&&!window.ShambConkins)e.remove();});}catch(e){}})();</script></div><div id="app"></div><dialog id="dialog" aria-labelledby="dialog-title"></dialog><div id="game-layer" hidden></div><div id="fx-layer" class="fx-layer" aria-hidden="true"></div><div id="toast" role="status" aria-live="polite"></div><noscript>This game needs JavaScript enabled.</noscript><!--@@SCRIPT@@--></body></html>
