# Manual Broforce validation is exposed on default branch so Actions > Run workflow
# can select feature/broforce-wave4-candidate. No automatic event triggers.
# Main does not contain these Broforce source files; choose candidate branch.
name: Broforce foundation validation

# CI COST CONTROL 2026-10-11: require explicit dispatch before expensive
# Broforce foundation + Chromium + Fold screenshot validation runs.
# Preserves all original jobs and acceptance gates, but disables push/PR storm.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: broforce-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-validation:
    if: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check six modules and six tests
        shell: bash
        run: |
          set -euo pipefail
          for source in src/engines/broforce/{terrain,physics,roster,worldArt,actorArt,audio}.js; do
            node --check "$source"
          done
          for test in tests/broforce-{terrain,physics,roster,world-art,actor-art,audio}.mjs; do
            node --check "$test"
          done
      - name: Run all six dedicated foundation tests
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for test in \
            tests/broforce-terrain.mjs \
            tests/broforce-physics.mjs \
            tests/broforce-roster.mjs \
            tests/broforce-world-art.mjs \
            tests/broforce-actor-art.mjs \
            tests/broforce-audio.mjs; do
            echo "::group::$test"
            if ! node "$test"; then
              echo "::error file=$test::Dedicated test failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Run all Broforce focused tests and scenario integration contracts
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/broforce-*.mjs; do
            # the turn-based game's own browser tests run after the build below
            case "$test" in tests/broforce-turns.mjs|tests/broforce-board.mjs) continue;; esac
            echo "::group::$test"
            node --check "$test"
            node "$test"
            echo "::endgroup::"
          done
          echo "::group::Broforce integrated scenario contracts"
          node tests/broforce-scenarios.mjs --integrated
          echo "::endgroup::"
      - name: Verify registered source modules
        run: node tools/check-modules.mjs
      - name: Build offline HTML
        run: npm run build
      - name: Install existing browser-test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /node-tools /opt/pw-browsers/chromium-1194/chrome-linux /tmp/claude-0/sc
          sudo chown -R "$USER" /node-tools /tmp/claude-0
          npm install --prefix /node-tools --no-audit --no-fund playwright@1.50.1
          /node-tools/node_modules/.bin/playwright install --with-deps chromium
          browser_executable=$(node -e "console.log(require('/node-tools/node_modules/playwright').chromium.executablePath())")
          sudo ln -s "$browser_executable" /opt/pw-browsers/chromium-1194/chrome-linux/chrome
      - name: Run complete npm test suite
        run: npm test
      - name: Turn-based Broforce in a real browser (phone portrait, phone landscape, desktop)
        run: OUT=/tmp/broforce-shots node tests/broforce-turns.mjs
      - name: Turn-based Broforce from the board (scores, gold-cage recruits, save)
        run: node tests/broforce-board.mjs
      - name: Upload Broforce screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broforce-turn-based-captures
          path: /tmp/broforce-shots/
          if-no-files-found: warn
