name: Probe the online rooms

# Manual only. Checks the live site's online rooms from a GitHub runner (tools/net-probe.mjs: joins, rejoin, "full",
# a 30-messages-a-second stream) while tailing the Worker's logs, then asks Cloudflare's analytics for the last days'
# Durable Object traffic and errors (free plan: 100,000 requests a day, incoming WebSocket messages count 20 to 1).
on:
  workflow_dispatch:
    inputs:
      base:
        description: Site to probe
        default: https://shambconkins.loki-mylo.work
      stream:
        description: Seconds of streaming
        default: '30'

jobs:
  probe:
    if: github.repository == 'seanpconners-source/ShambConkins'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start tailing the Worker
        continue-on-error: true
        run: |
          (cd cloudflare && npx --yes wrangler@4.152.0 tail shambconkins --format json > ../tail.jsonl 2> ../tail.err &)
          sleep 12
      - name: Probe
        continue-on-error: true
        run: node tools/net-probe.mjs "${{ inputs.base }}" "${{ inputs.stream }}"
      - name: Worker log summary
        continue-on-error: true
        run: |
          sleep 6; pkill -f "wrangler.*tail" || true
          echo "--- tail stderr"; tail -n 20 tail.err || true
          node -e '
          const fs=require("fs");let lines=[];try{lines=fs.readFileSync("tail.jsonl","utf8").split(/\n(?=\{)/).filter(Boolean);}catch{}
          const out={};let n=0;
          for(const l of lines){let e;try{e=JSON.parse(l);}catch{continue;}n++;
           const k=(e.event?.request?.url?"fetch ":e.event?.webSocketEventType?"ws ":"")+(e.outcome||"?");out[k]=(out[k]||0)+1;
           for(const x of e.exceptions||[])console.log("EXCEPTION",x.name,x.message);
           for(const x of e.logs||[])if(x.level!=="log")console.log("LOG",x.level,JSON.stringify(x.message).slice(0,300));
           if(e.outcome&&e.outcome!=="ok"&&e.outcome!=="canceled")console.log("OUTCOME",e.outcome,JSON.stringify(e.event).slice(0,300));}
          console.log("events",n,JSON.stringify(out));'
      - name: Cloudflare analytics (last 3 days)
        continue-on-error: true
        run: |
          SINCE=$(date -u -d '3 days ago' +%F)
          q() { node -e 'const [acc,since,body]=process.argv.slice(1);process.stdout.write(JSON.stringify({query:`query($acc:String!,$since:Date!){viewer{accounts(filter:{accountTag:$acc}){${body}}}}`,variables:{acc,since}}))' "$CLOUDFLARE_ACCOUNT_ID" "$SINCE" "$1" |
            curl -sS https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data @- ; echo; }
          echo "--- Durable Object invocations by day/status"
          q 'durableObjectsInvocationsAdaptiveGroups(limit:200,filter:{date_geq:$since},orderBy:[date_ASC]){sum{requests errors} dimensions{date status}}'
          echo "--- Durable Object usage by day"
          q 'durableObjectsPeriodicGroups(limit:200,filter:{date_geq:$since},orderBy:[date_ASC]){sum{activeTime cpuTime inboundWebsocketMsgCount outboundWebsocketMsgCount exceededCpuErrors exceededMemoryErrors fatalInternalErrors} dimensions{date}}'
          echo "--- Worker invocations by day/status"
          q 'workersInvocationsAdaptive(limit:200,filter:{date_geq:$since,scriptName:"shambconkins"},orderBy:[date_ASC]){sum{requests errors subrequests} dimensions{date status}}'
