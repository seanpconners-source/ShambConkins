name: Castlevania integration validation
on:
  push:
    branches:
      - integrate/castlevania-v0.58.2
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies at expected paths
        run: |
          sudo mkdir -p /node-tools /opt/pw-browsers/chromium-1194/chrome-linux /tmp/claude-0/sc
          sudo chown -R "$USER" /node-tools /tmp/claude-0
          cd /node-tools
          npm install --no-audit --no-fund playwright@1.50.1
          npx playwright install --with-deps chromium
          EXEC=$(node -e "console.log(require('/node-tools/node_modules/playwright').chromium.executablePath())")
          sudo ln -sf "$EXEC" /opt/pw-browsers/chromium-1194/chrome-linux/chrome
      - name: Source/module validation
        run: node tools/check-modules.mjs
      - name: Complete automated regression suite
        run: npm test
      - name: Castlevania phone and desktop gameplay tests
        run: node tests/castlevania.mjs
      - name: Build distributable v0.58.2
        run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: ShambConkins-v0.58.2-Castlevania
          path: releases/ShambConkins_v0.58.2.html
          if-no-files-found: error
