name: Prepare versioned release HTML

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]
    paths:
      - 'src/version.js'
  push:
    branches:
      - main
    paths:
      - 'src/version.js'

permissions:
  contents: write

concurrency:
  group: prepare-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-verify:
    if: github.event_name == 'pull_request' && github.repository == 'seanpconners-source/ShambConkins' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing browser test prerequisites
        working-directory: /tmp
        run: |
          sudo mkdir -p /node-tools /opt/pw-browsers/chromium-1194/chrome-linux /tmp/claude-0/sc
          sudo chown -R "$USER" /node-tools /tmp/claude-0
          cd /node-tools
          npm install --no-audit --no-fund playwright@1.50.1
          npx playwright install --with-deps chromium
          browser_executable=$(node -e "console.log(require('/node-tools/node_modules/playwright').chromium.executablePath())")
          sudo ln -s "$browser_executable" /opt/pw-browsers/chromium-1194/chrome-linux/chrome
      - name: Build production HTML and run complete core regressions
        shell: bash
        run: |
          set -euo pipefail
          npm run release
          npm run test:core 2>&1 | tee "$RUNNER_TEMP/release-core.log"
          grep -Fx 'errors: []' "$RUNNER_TEMP/release-core.log"
          grep -Fx 'errors []' "$RUNNER_TEMP/release-core.log"
          grep -Fx 'fork reached: true' "$RUNNER_TEMP/release-core.log"
          grep -Fx 'panel closed: true' "$RUNNER_TEMP/release-core.log"
          cmp -s releases/ShambConkins_v0.58.3.html dist/ShambConkins.html
          python3 - <<'PY'
          import hashlib, json, pathlib
          pkg=json.loads(pathlib.Path('package.json').read_text())
          version=pathlib.Path('src/version.js').read_text()
          built=pathlib.Path('releases/ShambConkins_v0.58.3.html')
          assert pkg['version']=='0.58.3'
          assert "const VERSION='0.58.3';" in version
          assert pkg['scripts']['release'].endswith('releases/ShambConkins_v0.58.3.html')
          assert built.stat().st_size > 1_000_000
          assert b"const VERSION='0.58.3'" in built.read_bytes()
          print('RELEASE_ARTIFACT_VALID', built.stat().st_size,hashlib.sha256(built.read_bytes()).hexdigest())
          PY
      - name: Browser smoke test production HTML
        shell: bash
        run: |
          set -euo pipefail
          node tests/smoke.mjs releases/ShambConkins_v0.58.3.html 2>&1 | tee "$RUNNER_TEMP/release-browser.log"
          grep -Fx 'errors: []' "$RUNNER_TEMP/release-browser.log"
      - name: Fuzz changed minigames on production HTML
        shell: bash
        env:
          SHAMB_FILE: releases/ShambConkins_v0.58.3.html
        run: |
          set -euo pipefail
          node tests/games.mjs 2 4 '^(taskmaster-micro-relay|taskmaster-fruit-ninja|gopher-hunt|trivia-(mixed|wager|survival|lightning))$' 2>&1 | tee "$RUNNER_TEMP/release-games.log"
          ! grep -q '^FAIL ' "$RUNNER_TEMP/release-games.log"
          grep -Eq '^[1-9][0-9]*/[1-9][0-9]* games ran clean$' "$RUNNER_TEMP/release-games.log"
      - name: Upload validated release HTML without adding a 130MB Git blob
        uses: actions/upload-artifact@v4
        with:
          name: ShambConkins_v0.58.3_candidate
          path: releases/ShambConkins_v0.58.3.html
          if-no-files-found: error
          retention-days: 14
      - name: Preserve release validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: versioned-release-logs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-core.log
            ${{ runner.temp }}/release-browser.log
            ${{ runner.temp }}/release-games.log
          if-no-files-found: ignore
          retention-days: 14

  publish-v0-58-3:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'seanpconners-source/ShambConkins'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild and verify exact approved v0.58.3 production file
        shell: bash
        run: |
          set -euo pipefail
          npm run release
          test "$(node -p "require('./package.json').version")" = "0.58.3"
          echo '4ca82a9511a2bf594ec83c4296f84f2f6cbb3a2d655ba813b62fb70504fa283e  releases/ShambConkins_v0.58.3.html' | sha256sum --check
          test "$(stat -c %s releases/ShambConkins_v0.58.3.html)" = 130007412
      - name: Publish v0.58.3 as a GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.58.3 releases/ShambConkins_v0.58.3.html \
            --target "$GITHUB_SHA" \
            --title "ShambConkins v0.58.3" \
            --notes "Six TESTver-validated gameplay fixes: player names, trivia, Pokémon Bond and haptics, Gopher Hunt moods, Fruit Ninja combos, and Taskmaster relay. All seven focused regressions, 139/139 minigame fuzz checks, and actual offline release HTML tests passed. Offline HTML provided as a release asset because it exceeds GitHub's 100 MB repository-file limit."
